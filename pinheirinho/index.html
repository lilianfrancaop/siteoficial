  .faq-lf-media{order:1;width:100%;max-width:620px;margin:0 auto}
  .faq-lf-content{order:2}
}
@media(max-width:600px){
  .faq-lf-grid{gap:19px}
  .faq-lf-media{border-radius:22px}
  .faq-lf-question{min-height:62px;padding:13px 13px;gap:9px;font-size:.76rem}
  .faq-lf-question::after{flex-basis:32px;width:32px;height:32px;border-radius:10px}
  .faq-lf-num{min-width:32px;height:32px;border-radius:10px}
  .faq-lf-answer{padding:0 14px 16px 54px;font-size:.72rem}
  .faq-lf-intro{font-size:.76rem;line-height:1.65}
  .faq-lf-more{width:100%;padding:13px 16px}
}
body.access-contrast .faq-lf{background:#001a3c!important}
body.access-contrast :where(.faq-lf-item,.faq-lf-media){background:#062f61!important;border-color:#fff!important}
body.access-contrast :where(.faq-lf-question,.faq-lf-answer,.faq-lf-answer strong,.faq-lf-intro,.faq-lf-subtitle){color:#fff!important}
body.access-lowstim .faq-lf-item,body.access-lowstim .faq-lf-media{box-shadow:none!important}

/* Ajustes aprovados — etapa 1 */
.axis-card strong{font-size:.984rem}.axis-card span{font-size:.768rem}.result-card{padding:17px 22px;min-height:232px;cursor:pointer;transition:transform .22s,background .22s}.result-card:hover{transform:translateY(-3px);background:linear-gradient(155deg,rgba(255,255,255,.23),rgba(255,255,255,.11))}.result-card:focus-visible{outline:3px solid #fff;outline-offset:3px}.result-card h3{margin:14px 0 8px}.result-card a{display:none}.bridge-carousel{position:relative;width:100%;height:100%;overflow:hidden}.bridge-carousel-track{display:flex;width:100%;height:100%;transition:transform .55s ease}.bridge-carousel-slide{flex:0 0 100%;width:100%;height:100%}.bridge-carousel-slide img{width:100%;height:100%;object-fit:cover;object-position:center}@media(max-width:640px){.axis-card strong{font-size:.984rem}.axis-card span{font-size:.768rem}.result-card{min-height:200px;padding:17px 22px}.bridge-carousel-slide img{object-position:center}}

<script>
(function(){
  const els=[...document.querySelectorAll('.countup')];
  if(!els.length) return;
  const reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const format=(el,n)=>`${el.dataset.prefix||''}${Math.round(n).toLocaleString('pt-BR')}${el.dataset.suffix||''}`;
  const finish=el=>{el.textContent=format(el,Number(el.dataset.target||0)); el.dataset.done='1';};
  if(reduced){els.forEach(finish);return;}
  const animate=el=>{
    if(el.dataset.done==='1') return;
    el.dataset.done='1';
    const target=Number(el.dataset.target||0), start=performance.now(), duration=820;
    const tick=now=>{
      const t=Math.min(1,(now-start)/duration);
      const eased=1-Math.pow(1-t,3);
      el.textContent=format(el,target*eased);
      if(t<1) requestAnimationFrame(tick); else finish(el);
    };
    requestAnimationFrame(tick);
  };
  const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){animate(e.target);io.unobserve(e.target)}}),{threshold:.35});
  els.forEach(el=>{el.textContent=format(el,0);io.observe(el)});
})();
</script><script>
(function(){
  // Timeline dinâmica
  const stage=document.querySelector('[data-timeline="true"]');
  if(stage){
    const steps=[...stage.querySelectorAll('.timeline-step')];
    const year=document.getElementById('timelineYear');
    const title=document.getElementById('timelineTitle');
    const text=document.getElementById('timelineText');
    const source=document.getElementById('timelineSource');
    const index=document.getElementById('timelineIndex');
    let current=0, timer=null;
    const reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function activate(i, user=false){
      current=(i+steps.length)%steps.length;
      const b=steps[current];
      steps.forEach((s,j)=>{s.classList.toggle('active',j===current);s.setAttribute('aria-current',j===current?'step':'false')});
      year.textContent=b.dataset.year; title.textContent=b.dataset.title; text.textContent=b.dataset.text; index.textContent=String(current+1).padStart(2,'0')+' / '+String(steps.length).padStart(2,'0');
      if(b.dataset.source){source.href=b.dataset.source;source.style.display='inline-flex'}else{source.style.display='none';source.removeAttribute('href')}
      if(user && window.innerWidth<981){
        const scroller=b.closest('.timeline-dynamic');
        if(scroller){
          const left=b.offsetLeft-(scroller.clientWidth-b.offsetWidth)/2;
          scroller.scrollTo({left:Math.max(0,left),behavior:reduced?'auto':'smooth'});
        }
      }
