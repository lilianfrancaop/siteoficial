<section aria-labelledby="agenda-title" class="section agenda-section" id="agenda">
  <style>
    .agenda-section {
      background: linear-gradient(135deg, #082f62 0%, #0A4E96 47%, #7e2a92 100%);
      color: #fff;
    }

    .agenda-section .agenda-head {
      max-width: 760px;
      margin: 0 auto 32px;
      text-align: center;
    }

    .agenda-section .agenda-head .kicker { color: #ffd8ec; }
    .agenda-section .agenda-head .title,
    .agenda-section .agenda-head .lead { color: #fff; }

    .agenda-section .agenda-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .agenda-section .agenda-panel {
      min-width: 0;
      height: 600px;
      overflow: hidden;
      background: #fff;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 20px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, .22);
    }

    .agenda-section .agenda-panel iframe {
      display: block;
      width: 100%;
      height: 600px;
      border: 0;
    }

    @media (max-width: 760px) {
      .agenda-section .agenda-grid { grid-template-columns: 1fr; gap: 18px; }
      .agenda-section .agenda-panel,
      .agenda-section .agenda-panel iframe { height: 600px; }
    }
  </style>

  <div class="wrap">
