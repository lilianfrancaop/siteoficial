.header .nav-dropdown{position:relative}
.header .nav-dropdown>summary{list-style:none;color:inherit;font-weight:700}
.header .nav-dropdown>summary::-webkit-details-marker{display:none}
.header .nav-dropdown>summary::after{content:'▾';margin-left:7px;font-size:.7em}
.header .nav-submenu{position:absolute;top:calc(100% + 8px);left:0;z-index:100;display:grid;min-width:220px;padding:8px;background:#062f68;border:1px solid rgba(255,255,255,.42);border-radius:16px;box-shadow:0 16px 36px rgba(0,0,0,.3)}
.header .nav-submenu a{display:block;padding:11px 13px;border-radius:11px;color:#fff;text-decoration:none;white-space:nowrap}
.header .nav-submenu a:hover{background:rgba(233,58,151,.8)}

@media(max-width:900px){.header .brand img{width:112px}.header .nav{font-size:.80rem;gap:4px}.header .nav>a,.header .nav-dropdown>summary{padding:7px 8px}}
@media(max-width:760px){
.header .head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:72px}
.header .brand{display:block;flex:0 0 auto;line-height:0}
.header .brand img{width:120px;max-width:100%;height:auto}
.header .menu{display:inline-flex!important;align-items:center;justify-content:center;flex:0 0 44px;width:44px;height:44px;margin-left:auto;padding:0;border:1px solid rgba(255,255,255,.35);border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:1.45rem;line-height:1;cursor:pointer}
.header .menu:focus-visible{outline:2px solid #fff;outline-offset:2px}
.header .nav{display:none!important;position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:1000;flex-direction:column;align-items:stretch;gap:6px;width:100%;max-height:calc(100vh - 96px);overflow-y:auto;padding:12px;margin:0;background:#062f68;border:1px solid rgba(255,255,255,.28);border-radius:16px;box-shadow:0 16px 36px rgba(0,0,0,.3);font-size:1rem}
.header .nav.is-open{display:flex!important}
.header .nav>a,.header .nav-dropdown>summary{width:100%;min-height:46px;box-sizing:border-box;justify-content:flex-start;padding:10px 12px}
.header .nav-dropdown{width:100%}
.header .nav-dropdown>summary{justify-content:space-between}
.header .nav-submenu{position:static;min-width:0;margin:4px 0 6px;padding:4px;background:rgba(0,0,0,.16);border:0;box-shadow:none}
.header .nav-submenu a{padding:11px 14px;white-space:normal}

}
</style><div class="wrap head"><a aria-label="Lílian França 11000" class="brand" href="#inicio"><img alt="Lílian França 11000 — Deputada Estadual" class="brand-logo" decoding="async" src="assets/logo-lilian-franca-11000.webp"></a><nav class="nav" id="nav"><a href="#quem">Quem é Lílian</a><details class="nav-dropdown"><summary>Atuação</summary><div class="nav-submenu"><a href="#resultados">Resultados</a><a href="#compromissos">11 compromissos</a><a href="#parceria">Articulação</a></div></details><a href="#agenda">Agenda</a><a href="#transparencia">Transparência</a><a download="lilian_franca_11_propostas.pdf" href="lilian_franca_11_propostas.pdf">E-book</a><a class="nav-cta" href="https://wa.me/553199614310?text=Ol%C3%A1.%20Acabo%20de%20visitar%20o%20seu%20site%20e%20queria%20entender%20melhor%20suas%20propostas" rel="noopener" target="_blank">Contato</a></nav><button aria-label="Abrir menu" class="menu" id="menuBtn">☰</button></div></header>
<script>
(function(){
  var header=document.querySelector('.header');
  if(!header) return;
  var btn=header.querySelector('#menuBtn');
  var nav=header.querySelector('#nav');
  if(!btn||!nav) return;

  btn.setAttribute('aria-controls','nav');
  btn.setAttribute('aria-expanded','false');

  function closeMenu(){
    nav.classList.remove('is-open');
    btn.setAttribute('aria-expanded','false');
    btn.setAttribute('aria-label','Abrir menu');
  }

  btn.addEventListener('click',function(){
    var open=nav.classList.toggle('is-open');
    btn.setAttribute('aria-expanded',open?'true':'false');
    btn.setAttribute('aria-label',open?'Fechar menu':'Abrir menu');
  });

  nav.addEventListener('click',function(e){
    if(e.target.closest('a') && window.matchMedia('(max-width:760px)').matches){
      closeMenu();
    }
  });

  document.addEventListener('click',function(e){
    if(window.matchMedia('(max-width:760px)').matches && nav.classList.contains('is-open') && !header.contains(e.target)){
      closeMenu();
    }
  });

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') closeMenu();
  });

  window.addEventListener('resize',function(){
    if(window.innerWidth>760) closeMenu();
  });
})();
</script>
